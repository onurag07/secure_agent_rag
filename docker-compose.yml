services:
  api:
    build: { context: ., target: production }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant     # internal Docker DNS
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
    depends_on:
      qdrant: { condition: service_healthy }
      redis:  { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources: { limits: { cpus: "2.0", memory: 2G } }

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
             --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispassword} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgvector: Postgres + vector extension (replaces Qdrant for vector search)
  postgres:
    image: pgvector/pgvector:pg16         # Official pgvector image
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # auto-run on first start
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.0
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3001:3000"]

volumes:
  qdrant_data:
  postgres_data:
  mongo_data: